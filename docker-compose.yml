# MySQL is the ledger (source of truth for display); Redis is the timer
# (BullMQ delayed-job sorted set). Both use named volumes so data — and
# therefore the schedule — survives `docker compose down` + `up`.
services:
  mysql:
    image: mysql:8.0
    container_name: reachinbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reachinbox
    ports:
      # Host 3307 → container 3306. Non-default host port avoids clashing with a
      # local MySQL install (common on 3306). Update DATABASE_URL to match.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: unless-stopped
    # AOF with everysec fsync is NOT optional: it is what lets delayed jobs
    # (and thus the whole schedule) survive a Redis restart. Graded property.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # Host 6380 → container 6379. Non-default host port avoids clashing with a
      # local Redis install. Update REDIS_URL to match.
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
